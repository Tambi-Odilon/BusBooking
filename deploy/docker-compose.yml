# Une installation = une société cliente. Lancement : voir scripts/install.sh
#   docker compose --env-file .env up -d --build
name: busbooking

x-app-env: &app-env
  NODE_ENV: production
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  PUBLIC_URL: ${PUBLIC_URL}
  JWT_SECRET: ${JWT_SECRET}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SMTP_ALLOW_SELF_SIGNED: ${SMTP_ALLOW_SELF_SIGNED:-false}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUST_PROXY: "true"
  UPLOAD_DIR: /app/uploads
  TZ: ${TZ:-UTC}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  # Site (fichiers Angular) + reverse proxy HTTPS (certificat Let's Encrypt automatique)
  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    image: busbooking-web:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  # API REST + temps réel
  api:
    build: { context: ../backend }
    image: busbooking-api:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_ROLE: api
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

  # Tâches planifiées : expiration des verrous, rapprochement des paiements, e-mails, voyages récurrents…
  worker:
    image: busbooking-api:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      APP_ROLE: worker
    volumes:
      - uploads:/app/uploads
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=1000"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Sauvegarde quotidienne de la base et des fichiers envoyés (logos, images)
  backup:
    build: { context: ./backup }
    image: busbooking-backup:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-35}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-190}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
