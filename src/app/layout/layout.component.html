<div class="min-h-screen bg-slate-50">

  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6v6"/><path d="M15 6v6"/>
            <path d="M2 12h19.6"/>
            <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>
            <circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 font-display leading-tight">Soatrans</h1>
          <p class="text-xs text-slate-500 leading-tight">{{ i18n.t().layout.tagline }}</p>
        </div>
      </a>

      <!-- Language switcher -->
      <div class="relative">
        <button (click)="toggleDrop()"
                class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-white
                       hover:border-blue-300 hover:bg-blue-50 transition-all text-sm font-medium text-slate-700">
          <span class="text-base leading-none">{{ currentMeta.flag }}</span>
          <span class="hidden sm:inline">{{ currentMeta.label }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               [class]="dropOpen() ? 'rotate-180 transition-transform' : 'transition-transform'">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>

        @if (dropOpen()) {
          <div class="fixed inset-0 z-10" (click)="closeDrop()"></div>
          <div class="absolute right-0 mt-2 w-44 bg-white border border-slate-200 rounded-xl shadow-lg z-20 overflow-hidden">
            @for (lang of langMeta; track lang.code) {
              <button (click)="setLang(lang.code)"
                      [class]="'w-full flex items-center gap-3 px-4 py-2.5 text-sm transition-colors ' +
                        (i18n.lang() === lang.code
                          ? 'bg-blue-50 text-blue-700 font-semibold'
                          : 'text-slate-700 hover:bg-slate-50')">
                <span class="text-base">{{ lang.flag }}</span>
                <span>{{ lang.label }}</span>
                @if (i18n.lang() === lang.code) {
                  <svg class="ml-auto" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                       viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                       stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5"/>
                  </svg>
                }
              </button>
            }
          </div>
        }
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 bg-white mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-sm text-slate-500">
      {{ i18n.t().layout.footer }}
    </div>
  </footer>

</div>
